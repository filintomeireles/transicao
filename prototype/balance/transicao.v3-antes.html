body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0}

.meter span{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter span b{color:var(--ink);font-family:var(--mono);font-weight:600}
.track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;border-radius:3px;background:var(--accent)}

.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.days{display:flex;flex-direction:column;gap:7px}
.sp-swim{--sp:var(--swim)} .sp-bike{--sp:var(--bike)} .sp-run{--sp:var(--run)} .sp-gen{--sp:var(--line)}

.lb{display:flex;flex-direction:column}

.lb .it.me{background:var(--accent-bg);font-weight:700}
.lb .it .n{font-family:var(--mono);color:var(--muted)}
.lb .it .t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.attr{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:2px 10px;align-items:center;font-size:14px}
.attr .v{font-family:var(--mono);font-weight:600;text-align:right}
.attr .track{grid-column:1/-1;margin:0}
.big{font-size:52px;font-weight:700;line-height:1}
.splits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}

.splits span{display:block;font-size:11px;color:var(--muted)}
.splits b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.feed{display:flex;flex-direction:column;gap:6px;font-size:14px}
.feed div{padding:7px 10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sp,var(--line));border-radius:0 7px 7px 0}
.feed div:last-child{animation:in .3s ease-out}
@keyframes in{from{transform:translateX(-6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.feed div:last-child{animation:none}}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:inline-block}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.item:last-child{border-bottom:0}
.flash{background:var(--accent-bg);border:1px solid var(--accent);border-radius:9px;padding:10px 12px;font-size:14px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.code{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:1px}
</style>

/* ---------- file import ---------- */
function hav(a,b){const R=6371,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function sportFrom(txt,kmh){txt=(txt||'').toLowerCase();
  if(/swim|nata/.test(txt))return'swim';if(/bik|cycl|ride|ciclis/.test(txt))return'bike';if(/run|corr/.test(txt))return'run';if(/train|strength|weight|forç/.test(txt))return'str';
  if(kmh>=15)return'bike';if(kmh>=5.5)return'run';return'other'}
function parseGPX(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('GPX ilegível');

  for(const p of pts){const c=[+p.getAttribute('lat'),+p.getAttribute('lon')];if(prev)km+=hav(prev,c);prev=c;
    for(const e of p.getElementsByTagName('*')){if(e.localName==='hr')hrs.push(+e.textContent);if(e.localName==='time')times.push(Date.parse(e.textContent))}}
  const t0=times[0],t1=times[times.length-1],sec=(t1-t0)/1000;
  const typ=(doc.getElementsByTagName('type')[0]||{}).textContent||(doc.getElementsByTagName('name')[0]||{}).textContent;
  return[{sport:sportFrom(typ,km/(sec/3600)),start:t0||null,sec,km,hr:hrs.length?hrs.reduce((a,b)=>a+b,0)/hrs.length:null}];
}
function parseTCX(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('TCX ilegível');
  const kid=(el,n)=>[...el.children].find(c=>c.localName===n);
  return[...doc.getElementsByTagName('Activity')].map(a=>{
    const laps=[...a.getElementsByTagName('Lap')];let sec=0,m=0,hrs=0,hrw=0;
    for(const l of laps){const t=+(kid(l,'TotalTimeSeconds')||{}).textContent||0,d=+(kid(l,'DistanceMeters')||{}).textContent||0;sec+=t;m+=d;
      const ah=kid(l,'AverageHeartRateBpm');if(ah){const v=+(kid(ah,'Value')||{}).textContent;if(v){hrs+=v*t;hrw+=t}}}
    const start=Date.parse(laps[0]?laps[0].getAttribute('StartTime'):(a.getElementsByTagName('Id')[0]||{}).textContent);
    return{sport:sportFrom(a.getAttribute('Sport'),m/1000/(sec/3600)),start:start||null,sec,km:m/1000,hr:hrw?hrs/hrw:null};
  });
}
function parseFIT(buf){
  const dv=new DataView(buf),hs=dv.getUint8(0),size=dv.getUint32(4,true);
  if(String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11))!=='.FIT')throw new Error('não é um ficheiro FIT');
  const end=Math.min(hs+size,dv.byteLength),defs={},out=[];let p=hs;

    if((ty===0||ty===2||ty===10||ty===13)&&sz===1)return inv(dv.getUint8(p),0xFF);
    if((ty===4||ty===11)&&sz===2)return inv(dv.getUint16(p,le),0xFFFF);
    if((ty===6||ty===12)&&sz===4)return inv(dv.getUint32(p,le),0xFFFFFFFF);
    if(ty===3&&sz===2)return dv.getInt16(p,le);if(ty===5&&sz===4)return dv.getInt32(p,le);return null};
  while(p<end){
    const h=dv.getUint8(p++);
    if(!(h&0x80)&&(h&0x40)){
      const local=h&15,dev=h&0x20;p++;const le=dv.getUint8(p++)===0,g=dv.getUint16(p,le);p+=2;const nf=dv.getUint8(p++),fields=[];
      for(let i=0;i<nf;i++){fields.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)&31]);p+=3}
      let ds=0;if(dev){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){ds+=dv.getUint8(p+1);p+=3}}

    }
  }
  if(!out.length)throw new Error('FIT sem resumo de sessão');
  return out.map(r=>({sport:{1:'run',2:'bike',5:'swim',4:'str',10:'str'}[r[5]]||'other',start:r[2]!=null?(r[2]+631065600)*1000:null,sec:(r[7]!=null?r[7]:r[8]||0)/1000,km:(r[9]||0)/100000,hr:r[16]||null}));
}
async function readFiles(list){
  const acts=[],errs=[];
  for(const f of list){
    const ext=f.name.split('.').pop().toLowerCase();
    try{
      if(ext==='fit')acts.push(...parseFIT(await f.arrayBuffer()));
      else if(ext==='gpx')acts.push(...parseGPX(await f.text()));
      else if(ext==='tcx')acts.push(...parseTCX(await f.text()));
      else errs.push(`${f.name}: formato não suportado`);
    }catch(e){errs.push(`${f.name}: ${e.message}`)}
  }
  return{acts:acts.filter(a=>a.sec>60&&a.sport!=='other'),errs};
}
function sampleActs(){
  const now=Date.now(),day=864e5,list=[];
  for(let w=0;w<6;w++){const b=now-w*7*day;
    list.push({sport:'run',start:b-5*day,sec:3300,km:10.1,hr:146},{sport:'run',start:b-day,sec:6400,km:19.5,hr:142},{sport:'run',start:b-3*day,sec:2700,km:9,hr:163},
      {sport:'bike',start:b-2*day,sec:7200,km:56,hr:132},{sport:'swim',start:b-4*day,sec:2100,km:1.5,hr:null})}
  return list;
}
function classify(act,a,age){
  const min=act.sec/60,hrmax=age?208-.7*age:188,kmh=act.km/(act.sec/3600);
  if(act.sport==='swim')return min>=40||act.km>=2?'swimEnd':'swimTec';
  if(act.sport==='str')return'str';
  if(act.sport==='bike'){const spd=43-(90-(.7*a.bikePow+.3*a.bikeEnd))*.31;const hi=act.hr?act.hr>=.82*hrmax:kmh>=spd*.95;return hi&&min<110?'bikeInt':'bikeZ2'}
  if(act.sport==='run'){const rp=185+(90-(.6*a.runSpd+.4*a.runEnd))*4.7;const hi=act.hr?act.hr>=.85*hrmax:act.sec/act.km<=rp*1.1;return hi?'runInt':'runZ2'}
  return null;
}
function attrsFromActs(acts){
  const runs=acts.filter(a=>a.sport==='run'&&a.km>=3),rides=acts.filter(a=>a.sport==='bike'&&a.km>=15),swims=acts.filter(a=>a.sport==='swim'&&a.km>0);

  if(runs.length){const best=Math.min(...runs.map(r=>r.sec/r.km))*.92;a.runSpd=clamp(90-(best-185)/4.7,15,92);a.runEnd=clamp(30+Math.max(...runs.map(r=>r.km))*1.1,15,92)}
  if(rides.length){const best=Math.max(...rides.map(r=>r.km/(r.sec/3600)));a.bikePow=clamp(90-(43-best*1.03)/.31,15,92);a.bikeEnd=clamp(30+Math.max(...rides.map(r=>r.km))*.2,15,92)}
  if(swims.length){const best=Math.min(...swims.map(s=>s.sec/(s.km*10)));a.swimTec=clamp(90-(best-70)/1.35,10,92);a.swimEnd=clamp(25+Math.max(...swims.map(s=>s.km))*10,10,92)}

    sports:{run:runs.length,bike:rides.length,swim:swims.length}};
}

/* ---------- week ---------- */
function processWeek(){

  if(wis()===1){S.ath.age++;S.slots={};S.inbox.unshift({k:'msg',t:`Começa a temporada ${season()}`,x:`Fizeste anos: agora tens ${S.ath.age}, escalão ${AG(S.ath.age)}. Os adversários também treinaram no inverno.`,done:true})}
  if(S.money<-200){S.money+=300;S.moral-=10;S.inbox.unshift({k:'msg',t:'A família emprestou 300 €',x:'"Isto do triatlo dá dinheiro, não dá?" Moral −10.',done:true})}
  S.inbox=S.inbox.filter(m=>m.done||m.k==='offer').slice(0,14);
  for(const sp of SPONSORS)if(S.fame>=sp.minFame&&!S.offered[sp.id]&&!S.sponsors.find(x=>x.id===sp.id)){S.offered[sp.id]=1;S.inbox.unshift({k:'offer',id:sp.id,t:`Proposta: ${sp.n}`,x:`${sp.d} ${eur(sp.weekly)} por semana durante ${sp.weeks} semanas, mais ${eur(sp.podium)} por pódio.`});break}
  if(Math.random()<.55){const pool=Object.entries(EVENTS).filter(([id,e])=>(!e.minFame||S.fame>=e.minFame)&&(!e.job||S.job));const[id,e]=pick(pool);S.inbox.unshift({k:'ev',id,t:e.t,x:e.x})}
}

/* ---------- race ---------- */
function sim(a,race,ch,ctx){
  const D=DIST[race.t],ev=[],long=race.t==='meia';
  const noise=()=>1+gauss()*.015*(1.3-a.mental/100*.6),fm=1-clamp(ctx.form,-30,30)*.0015;
  const sw=long?.5*a.swimTec+.5*a.swimEnd:.6*a.swimTec+.4*a.swimEnd;
  const P={frente:[.965,.3],lado:[.985,.1],tras:[1,0]}[ch.pos],wsOn=race.temp<22&&ctx.ws>0;
  let swim=D.swim/100*Math.max(62,70+(90-sw)*1.35)*P[0]*(wsOn?1-ctx.ws:1)*fm*noise();
  if(Math.random()<P[1]){const x=rnd(25,70);swim+=x;ev.push(['swim',`Pancada na confusão da primeira boia: perdeste ${Math.round(x)} s.`])}
  const t1=(50+(100-a.trans)*1.3+(wsOn?(ctx.wsFast?6:14):0))*noise();
  const bk=long?.5*a.bikePow+.5*a.bikeEnd:.7*a.bikePow+.3*a.bikeEnd;
  const I={.75:[.95,24],.82:[.975,38],.88:[1,54],.95:[1.025,80]}[ch.int];
  const bike=D.bike/((43-(90-bk)*.31)*I[0]*(1+ctx.bike))*3600*fm*noise();
  let energy=100-I[1]*(D.bike/40)*(1.3-a.bikeEnd/100*.6)-45*(D.run/10)*(1.3-a.runEnd/100*.6)+ch.gels*14;
  let stomach=0;if(ch.gels>GELS[race.t]+1&&Math.random()<.45){stomach=rnd(50,130);ev.push(['bike',`Géis a mais: estômago às voltas. Perdeste ${Math.round(stomach)} s.`])}
  const t2=(35+(100-a.trans)*.8)*noise();
  const rr=long?.4*a.runSpd+.6*a.runEnd:.6*a.runSpd+.4*a.runEnd;
  const ST={conservador:[1.02,10],constante:[1,0],agressivo:[.975,-15],negativo:[.99,-5]}[ch.strat];energy+=ST[1];
  let rp=(185+(90-rr)*4.7)*ST[0]*(1-ctx.shoe);
  if(ch.strat==='negativo'&&a.mental<55&&Math.random()<.5){rp*=1.02;ev.push(['run','Querias acelerar na segunda metade, mas a cabeça não deixou.'])}
  if(energy<20){const k=(20-energy)*.006;rp*=1+k;ev.push(['run',`Bateste na parede: o ritmo caiu ${Math.round(k*100)}%.`])}
  const run=D.run*rp*fm*noise()+stomach;
  return{swim,t1,bike,t2,run,total:swim+t1+bike+t2+run,ev,spd:D.bike/(bike/3600),rp:(run-stomach)/D.run};
}
function attrsAround(R){const a={};for(const k in ATTR)a[k]=clamp(R+gauss()*9,15,96);a.mental=clamp(55+gauss()*15,20,95);return a}
function runRace(){
  const r=S.race,ch=r.ch,cat=S.ath.cat,n=cat==='F'?r.nF:r.nM,mean=r.lvl+(cat==='F'?-8:0)+(season()-1)*3;
  const used=new Set([S.ath.name]),field=[];
  const add=(nm,age,R,tag,club)=>{used.add(nm);const a=attrsAround(R);
    field.push({nm,age,ag:AG(age),tag,club,...sim(a,r,{pos:pick(['frente','lado','lado','tras']),int:r.t==='meia'?.82:.88,gels:GELS[r.t],strat:'constante'},{form:gauss()*6,bike:rnd(0,.06),ws:.04,shoe:rnd(0,.015)})})};
  add(S.rival.nm,S.rival.age,S.rival.r,'rival',pick(OTHER_CLUBS));
  const friends=S.club.members.filter(m=>m.cat===cat).sort(()=>Math.random()-.5).slice(0,Math.random()<.5?2:3);
  friends.forEach(m=>add(m.nm,m.age,m.r,'clube',myClub().n));
  while(field.length<n-1){let nm;do nm=nameFor(cat);while(used.has(nm));const age=18+Math.floor(Math.random()*47);
    add(nm,age,mean+gauss()*10-Math.max(0,age-40)*.35,'',Math.random()<.5?pick(OTHER_CLUBS):'')}
  const me=sim(S.a,r,ch,{form:form(),bike:bikeGear(),ws:wsVal(),wsFast:!!S.owned.wsPro,shoe:S.owned.carbon?.015:0});
  Object.assign(me,{nm:S.ath.name,age:S.ath.age,ag:AG(S.ath.age),tag:'tu',club:myClub().n,me:true});field.push(me);
  const N=field.length,posAt=keys=>field.map(f=>({f,t:keys.reduce((s,k)=>s+f[k],0)})).sort((a,b)=>a.t-b.t).findIndex(x=>x.f.me)+1;
  const pSwim=posAt(['swim']),pBike=posAt(['swim','t1','bike']);
  field.sort((a,b)=>a.total-b.total);field.forEach((f,i)=>f.pos=i+1);
  const p=me.pos,agList=field.filter(f=>f.ag===me.ag),agP=agList.indexOf(me)+1,clubList=field.filter(f=>f.tag==='clube'||f.me);
  const riv=field.find(f=>f.tag==='rival'),beatRival=me.total<riv.total;
  const catL=cat==='F'?'feminina':'masculina',o=cat==='F'?'ª':'º';
  const wsOn=r.temp<22&&wsVal()>0;
  const feed=[
    ['gen',`Partida da prova ${catL}: ${N} atletas, água a ${r.temp} °C${r.temp<22?(wsOn?', com fato':', sem fato isotérmico'):''}.`],
    ...me.ev.filter(e=>e[0]==='swim'),
    ['swim',`Sais da água em ${pSwim}${o} (${pace(me.swim/(DIST[r.t].swim/100))}/100 m).`],
    ['gen',`T1 em ${fmt(me.t1)}.`],
    ...me.ev.filter(e=>e[0]==='bike'),
    ['bike',`Bike a ${dec(me.spd)} km/h. Chegas à T2 em ${pBike}${o}.`],
    ['gen',`T2 em ${fmt(me.t2)}.`],
    ...me.ev.filter(e=>e[0]==='run'),
    ['run',beatRival?`Passas ${riv.nm} na corrida!`:`${riv.nm} vai à tua frente na corrida.`],
    ['run',`Meta! ${p}${o} da geral ${catL}, ${agP}${o} no escalão ${me.ag}.`]
  ];
  const rt=RT[r.t],prize=p<=3?[300,150,80][p-1]*rt.prize:0;
  let fame=Math.max(0,(N*.5-p))/N*20*rt.fame+1+(agP===1?2:0);
  const pts=Math.round(Math.max(0,1-(p-1)/N)*40*rt.pts);
  let bonus=0;if(p<=3)S.sponsors.forEach(sp=>bonus+=sp.podium);
  let slot='';if(r.slot&&agP<=r.slot){S.slots.algarve=true;slot='Vaga para a Meia distância do Algarve'}
  const L=S.legends[r.id];let legend='';if(S.raceCount[r.id]>L.count){L.nm=S.ath.name;L.count=S.raceCount[r.id];legend=`És a lenda local de ${r.n}.`}
  S.money+=prize+bonus;S.fame+=fame;S.pts+=pts;
  S.fatigue=clamp(S.fatigue+rt.fat,0,100);S.a.mental=Math.min(99,S.a.mental+.6);S.a.trans=Math.min(99,S.a.trans+.4);
  S.moral=clamp(S.moral+(p<=N*.2?8:p>N*.6?-6:2)+(beatRival?5:0),0,100);
  if(beatRival)S.rival.beaten++;else S.rival.lost++;
  S.rival.r+=.6+Math.random()*.8+(beatRival?.6:0);
  const lost=S.sponsors.filter(sp=>sp.req&&p/N>sp.req);
  lost.forEach(sp=>S.inbox.unshift({k:'msg',t:`${sp.n} rescindiu o contrato`,x:`Acabaste em ${p}${o} de ${N}, fora do top ${Math.round(sp.req*100)}%.`,done:true}));
  S.sponsors=S.sponsors.filter(sp=>!lost.includes(sp));
  const row=f=>({pos:f.pos,nm:f.nm,tag:f.tag,ag:f.ag,total:f.total,me:!!f.me});
  const lists={geral:field.slice(0,10).map(row),escalao:agList.slice(0,10).map(row),clube:clubList.map(row)};
  if(p>10)lists.geral.push(row(me));if(agP>10)lists.escalao.push(row(me));
  S.results.push({week:S.week,season:season(),id:r.id,n:r.n,t:r.t,p,N,agP,agN:agList.length,ag:me.ag,total:me.total});
  r.stage='running';r.view='escalao';
  r.res={feed,p,N,agP,agN:agList.length,ag:me.ag,catL,o,me:{swim:me.swim,t1:me.t1,bike:me.bike,t2:me.t2,run:me.run,total:me.total},lists,prize,bonus,fame,pts,slot,legend,beatRival,rivalNm:riv.nm};
  r.shown=0;save();render();tick();
}
function tick(){const r=S.race;if(!r||r.stage!=='running')return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)r.shown=r.res.feed.length;
  if(r.shown<r.res.feed.length){r.shown++;render();setTimeout(tick,800)}else{r.stage='done';save();render()}}

/* ---------- actions ---------- */
const price=it=>Math.round(it.p*(it.cat==='Bike'&&S.sponsors.find(s=>s.disc)?.7:1));
async function importWeek(files){
  const{acts,errs}=await readFiles(files);addReal(acts,errs);
}
function addReal(acts,errs=[]){
  let added=0;const seen=new Set(S.real.flat().map(r=>r.key));
  for(const a of acts){
    const k=classify(a,S.a,S.ath.age);if(!k)continue;
    const key=a.sport+':'+(a.start||'')+':'+Math.round(a.sec);if(seen.has(key))continue;seen.add(key);
    let d=a.start?(new Date(a.start).getDay()+6)%7:S.real.findIndex(x=>!x.length);if(d<0)d=0;
    const race=raceThisWeek();if(d===6&&race&&canEnter(race))d=5;
    S.real[d].push({k,key,ratio:clamp(a.sec/60/SESS[k].min,.4,2.5),min:Math.round(a.sec/60),km:Math.round(a.km*10)/10,sport:a.sport,hr:a.hr?Math.round(a.hr):null});added++;
  }
  S.flash=added?`${added} treino(s) real(is) importado(s). Contam com +10% nos ganhos.`:'Nenhum treino novo importado.';
  if(errs.length)S.flash+=' '+errs.join('; ');
  save();render();
}
function act(name,arg){
  const A={
    tab:()=>{S.tab=arg;S.flash='';window.scrollTo(0,0)},
    ob:()=>{const[k,v]=arg.split('=');S.ob[k]=v;if(k==='start')S.ob.err.files=''},
    obSample:()=>{S.ob.imp=attrsFromActs(sampleActs());S.ob.imp.sample=true;S.ob.err.files=''},
    create:()=>{if(createAthlete())window.scrollTo(0,0)},
    preset:()=>{S.plan=PRESETS[arg].slice()},
    close:()=>processWeek(),
    unreal:()=>{S.real[+arg]=[]},
    sampleReal:()=>{const d=new Date(),sat=new Date(d.getTime()-((d.getDay()+1)%7)*864e5);addReal([{sport:'run',start:sat.getTime(),sec:3480,km:10.4,hr:144}])},
    ev:()=>{const[i,o]=arg.split(':').map(Number);const m=S.inbox[i];m.res=EVENTS[m.id].o[o][1](S);m.done=true;S.moral=clamp(S.moral,0,100);S.fatigue=clamp(S.fatigue,0,100)},
    accept:()=>{const m=S.inbox[+arg],sp=SPONSORS.find(x=>x.id===m.id);if(S.sponsors.length>=3){m.res='Já tens 3 patrocinadores. Espera que um contrato acabe.';return}S.sponsors.push({...sp,left:sp.weeks});m.done=true;m.k='msg';m.res=`Assinaste com ${sp.n}.`},
    decline:()=>{const m=S.inbox[+arg];m.done=true;m.k='msg';m.res='Recusaste a proposta.'},
    buy:()=>{const it=SHOP.find(x=>x.id===arg),pr=price(it);if(S.money<pr){S.flash=`Faltam ${eur(pr-S.money)} para ${it.n.toLowerCase()}.`;return}
      S.money-=pr;if(it.sub){S.subs[it.id]=true;return}if(it.id==='shoes'){S.shoeKm=0;S.shoeWarned=false}else if(it.id==='massage')S.fatigue=clamp(S.fatigue-15,0,100);else S.owned[it.id]=true;S.flash=`Compraste: ${it.n.toLowerCase()}.`},
    unsub:()=>{S.subs[arg]=false},
    quit:()=>{S.quitAsk=true},quitYes:()=>{S.job=false;S.quitAsk=false},quitNo:()=>{S.quitAsk=false},
    job:()=>{S.job=true},
    rc:()=>{const[k,v]=arg.split('=');S.race.ch[k]=k==='pos'||k==='strat'?v:+v},
    gels:()=>{S.race.ch.gels=clamp(S.race.ch.gels+(+arg),0,8)},
    start:()=>runRace(),
    view:()=>{S.race.view=arg},
    raceDone:()=>{S.race=null;endWeek();window.scrollTo(0,0)},
    clubView:()=>{S.clubView=arg},
    copy:()=>{const t=S.invite;const done=()=>{S.flash=`Código ${t} copiado.`;save();render()};
      try{navigator.clipboard.writeText(t).then(done,()=>{S.flash=`Copia o código à mão: ${t}`;save();render()})}catch(e){S.flash=`Copia o código à mão: ${t}`}},
    reset:()=>{S.resetAsk=true},resetYes:()=>{S=initState()},resetNo:()=>{S.resetAsk=false}
  };
  if(A[name]){A[name]();if(!['close','start','copy'].includes(name)){save();render()}}
}

    const s=SESS[k],b=bonusFor(i,k);
    const note=b.includes('club')?'<span class="chip acc">clube +15%</span>':b.includes('group')?'<span class="chip acc">grupo +15%</span>':i===ev.d?`<span class="small muted">${ev.sp==='bike'?'bike':'corrida'} do clube</span>`:i===6?'<span class="small muted">long run do grupo</span>':'';
    return`<div class="day sp-${s.sp}"><span class="d">${DAYS[i]}</span><select id="d${i}" data-day="${i}" aria-label="Treino de ${DAYL[i]}">${Object.entries(SESS).map(([id,x])=>`<option value="${id}" ${id===k?'selected':''}>${x.n}</option>`).join('')}</select><span class="r">${note}</span></div>`}).join('');
  const L=S.last,nr=nextRace();
  return`${S.flash?`<div class="flash" role="status">${esc(S.flash)}</div>`:''}${vInbox()}
  <div class="between"><h1>Plano da semana</h1><span class="small muted">${S.ath.cat==='F'?'F':'M'} ${AG(S.ath.age)}</span></div>
  <div class="row"><span class="small muted">Modelos</span>${Object.keys(PRESETS).map(p=>`<button class="btn sm" data-act="preset" data-arg="${p}">${p}</button>`).join('')}</div>
  <div class="days">${days}</div>
  <div class="small muted mono">Carga ${pj.load} TL · fadiga prevista ${Math.round(pj.f)} · forma prevista ${pj.form>=0?'+':''}${Math.round(pj.form)}${S.injury?` · lesão (${esc(S.injuryName)})`:''}${S.rain?' · chuva':''}</div>
  ${nr?`<div class="small">Próxima prova: <b>${esc(nr.n)}</b> ${nr.w===wis()?'este domingo':`daqui a ${nr.w-wis()} semana(s)`}${!canEnter(nr)?` · <span style="color:var(--bad)">${whyNot(nr)}</span>`:''}${nr.w-wis()<=1&&canEnter(nr)?'. Alivia para chegar com forma alta.':''}</div>`:''}
  <div class="row"><span class="btn sm file">Importar treino real<input type="file" id="wk-files" data-file="week" multiple accept=".fit,.gpx,.tcx" aria-label="Importar ficheiros FIT, GPX ou TCX"></span><button class="btn sm" data-act="sampleReal">Treino de exemplo</button><span class="small muted">FIT, GPX, TCX</span></div>
  <button class="btn primary" data-act="close">${enter?'Fechar semana e ir para a prova':'Fechar semana'}</button>
  ${L?`<div class="card"><h2>Resumo da semana ${L.week}</h2><div class="small mono">Carga ${L.load} TL · saldo ${L.fin>=0?'+':''}${eur(L.fin)}</div>
    <div class="row">${Object.entries(L.gains).filter(([,g])=>Math.abs(g)>=.05).map(([k,g])=>`<span class="chip ${g>0?'good':'bad'}">${SPN[ATTR[k][1]]} ${ATTR[k][0].toLowerCase()} ${g>0?'+':''}${dec(g)}</span>`).join('')||'<span class="small muted">Sem ganhos.</span>'}</div>
    ${L.rep.map(r=>`<div class="small">${esc(r)}</div>`).join('')}</div>`:''}`;
}
function seg(k,opts,cls=''){const v=S.race.ch[k];return`<div class="seg ${cls}" role="group">${opts.map(([val,l])=>`<button data-act="rc" data-arg="${k}=${val}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join('')}</div>`}
function vProva(){
  const r=S.race,D=DIST[r.t];
  if(r.stage==='setup'){const f=form();const n=S.ath.cat==='F'?r.nF:r.nM;
    return`<h1>${esc(r.n)}</h1><div class="small muted">${D.l} · ${D.swim} m · ${D.bike} km · ${dec(D.run)} km · ${n} atletas na prova ${S.ath.cat==='F'?'feminina':'masculina'}</div>
    <div class="small">Água a ${r.temp} °C · ${r.temp<22?(wsVal()?'fato permitido e tens um':'fato permitido, mas não tens'):'sem fatos'} · forma ${f>=0?'+':''}${Math.round(f)}</div>
    <span class="small muted">Natação · posição na partida</span>${seg('pos',[['frente','Frente'],['lado','Lado'],['tras','Trás']])}
    <span class="small muted">Bike · % do FTP</span>${seg('int',[[.75,'75'],[.82,'82'],[.88,'88'],[.95,'95']])}
    <span class="small muted">Géis na bike</span><div class="seg"><button data-act="gels" data-arg="-1" aria-label="Menos um gel">−</button><button aria-pressed="false" tabindex="-1" style="font-weight:700">${r.ch.gels} gé${r.ch.gels===1?'l':'is'}</button><button data-act="gels" data-arg="1" aria-label="Mais um gel">+</button></div>
    <span class="small muted">${S.owned.nutri?`A nutricionista recomenda ${GELS[r.t]}.`:'Poucos e bates na parede; demasiados e o estômago reclama.'}</span>
    <span class="small muted">Corrida · estratégia</span>${seg('strat',[['conservador','Conservador'],['constante','Constante'],['negativo','Negative split'],['agressivo','Agressivo']],'two')}
    <div class="small muted">Na prova: ${S.ath.cat==='F'?'a tua rival':'o teu rival'} ${esc(S.rival.nm)} e amigos do ${esc(myClub().n)}.</div>
    <button class="btn primary" data-act="start">Partida</button>`}
  const R=r.res,feed=R.feed.slice(0,r.shown).map(([sp,t])=>`<div style="--sp:var(--${sp==='gen'?'line':sp})">${esc(t)}</div>`).join('');
  if(r.stage!=='done')return`<h1>${esc(r.n)}</h1><div class="feed" aria-live="polite">${feed}</div>`;
  const list=R.lists[r.view||'escalao'];
  return`<h1>${esc(r.n)}</h1>
  <div class="row" style="gap:16px;align-items:center"><span class="big">${R.p}${R.o}</span><div><div class="small muted">geral ${R.catL}, de ${R.N}</div><div class="mono" style="font-size:18px;font-weight:600">${fmt(R.me.total)}</div></div></div>
  <div class="card acc" style="padding:10px;text-align:center"><b>${R.agP}${R.o} no escalão ${S.ath.cat} ${R.ag}</b></div>
  <div class="splits">${[['Nat',R.me.swim],['T1',R.me.t1],['Bike',R.me.bike],['T2',R.me.t2],['Corr',R.me.run]].map(([l,t])=>`<div><span>${l}</span><b>${fmt(t)}</b></div>`).join('')}</div>
  <div class="seg">${[['geral','Geral'],['escalao','Escalão'],['clube','Clube']].map(([k,l])=>`<button data-act="view" data-arg="${k}" aria-pressed="${(r.view||'escalao')===k}">${l}</button>`).join('')}</div>
  <div class="lb">${list.map((x,i)=>`<div class="it ${x.me?'me':''}"><span class="n">${r.view==='geral'?x.pos:r.view==='clube'?i+1:(R.lists.escalao.indexOf(x)>=0&&x.me?R.agP:i+1)}</span><span>${x.me?'Tu':esc(x.nm)}${x.tag==='rival'?' · rival':x.tag==='clube'?' · clube':''}${r.view==='geral'?` <span class="small muted">${x.ag}</span>`:''}</span><span class="t">${fmt(x.total)}</span></div>`).join('')}</div>
  <div class="small">${R.prize?eur(R.prize)+' · ':''}${R.bonus?'bónus '+eur(R.bonus)+' · ':''}+${Math.round(R.fame)} fama · +${R.pts} pontos de ranking</div>
  ${R.slot?`<div class="small" style="color:var(--accent);font-weight:700">${R.slot}</div>`:''}${R.legend?`<div class="small" style="color:var(--accent);font-weight:700">${R.legend}</div>`:''}
  <div class="small">${R.beatRival?`Bateste ${esc(R.rivalNm)}. Moral +5.`:`${esc(R.rivalNm)} ficou à tua frente desta vez.`}</div>
  <button class="btn primary" data-act="raceDone">Continuar</button>`;
}
function vAtleta(){
  const A=S.ath,groups=['swim','bike','run','gen'].map(sp=>`<div class="card sp-${sp}" style="border-top:3px solid var(--sp)"><h2>${SPN[sp]}</h2>${Object.entries(ATTR).filter(([,v])=>v[1]===sp).map(([k,v])=>`<div class="attr"><span>${v[0]}</span><span class="v">${Math.round(S.a[k])}</span>${bar(S.a[k],sp==='gen'?'var(--muted)':`var(--${sp})`)}</div>`).join('')}</div>`).join('');
  const gear=S.gear.concat(SHOP.filter(i=>S.owned[i.id]&&!(i.id==='carbon'&&A.start==='filinto')).map(i=>[i.n,i.d]));
  return`<div class="between"><div><h1>${esc(A.name)}</h1><div class="small muted">${A.cat==='F'?'Feminino':'Masculino'} · ${A.age} anos · escalão ${AG(A.age)} · ${esc(A.city)}</div><div class="small muted">${esc(myClub().n)}</div></div><span class="big" style="font-size:44px">${overall(S.a)}</span></div>
  <div class="small muted">Fitness ${Math.round(S.ctl)} · fadiga ${Math.round(S.fatigue)} · forma ${Math.round(form())}. A forma é fitness menos fadiga: treina com consistência e alivia antes das provas.</div>
  ${groups}
  <div class="card"><h2>${A.cat==='F'?'Rival':'Rival'}: ${esc(S.rival.nm)}</h2><div class="small">${S.rival.age} anos · escalão ${AG(S.rival.age)} · nota ${Math.round(S.rival.r)}</div><div class="small muted">Duelos: ${S.rival.beaten} vitórias, ${S.rival.lost} derrotas.</div></div>
  <div class="card"><h2>Vida</h2><div class="small">${S.job?'Emprego a meio tempo: +320 € por semana, +6 de fadiga.':'Atleta a tempo inteiro: +10% nos ganhos.'} Custo de vida: 180 € por semana.</div>
  ${S.injury?`<div class="small" style="color:var(--bad)">Lesão: ${esc(S.injuryName)} (${S.injury} semana(s)).</div>`:''}
  ${S.job?(S.quitAsk?`<div class="msg"><b>Largar o emprego?</b><span class="small">Perdes 320 € por semana. Os patrocínios rendem ${eur(S.sponsors.reduce((a,s)=>a+s.weekly,0))} por semana.</span><div class="row"><button class="btn sm" data-act="quitYes">Sim, largar</button><button class="btn sm" data-act="quitNo">Cancelar</button></div></div>`:`<div><button class="btn sm" data-act="quit">Largar o emprego</button></div>`):`<div><button class="btn sm" data-act="job">Voltar ao emprego</button></div>`}</div>
  <div class="card"><h2>Equipamento</h2>${gear.map(([a,b])=>`<div class="item"><span>${esc(a)}</span><span class="small muted">${esc(b)}</span></div>`).join('')}<div class="item"><span>Sapatilhas de treino</span><span class="small muted ${S.shoeKm>700?'chip bad':''}">${S.shoeKm} km</span></div></div>
  <div class="card"><h2>Jogo</h2>${S.resetAsk?`<div class="row"><span class="small">Apagar esta carreira?</span><button class="btn sm" data-act="resetYes">Apagar e recomeçar</button><button class="btn sm" data-act="resetNo">Cancelar</button></div>`:`<div><button class="btn sm" data-act="reset">Nova carreira</button></div>`}</div>`;
}
function vClube(){
  const c=myClub(),C=S.club,view=S.clubView||'semana';
  const table=[{n:c.n,v:view==='divisao'?C.season:C.score,me:true},...C.others.map(o=>({n:o.n,v:view==='divisao'?o.season:o.score}))].sort((a,b)=>b.v-a.v);
  const people=[...C.members.map(m=>({nm:m.nm,pts:m.pts})),{nm:'Tu',pts:C.myPts||0,me:true}].sort((a,b)=>b.pts-a.pts);
  const fr=C.members.slice(0,3);
  return`${S.flash?`<div class="flash" role="status">${esc(S.flash)}</div>`:''}
  <div class="between"><h1>${esc(c.n)}</h1><span class="chip acc">verificado</span></div>
  <div class="small muted">${c.members} membros · ${C.members.length+1} no jogo · divisão ${C.div} · ${table.findIndex(t=>t.me)+1}º</div>
  <div class="seg">${[['semana','Semana'],['divisao','Divisão']].map(([k,l])=>`<button data-act="clubView" data-arg="${k}" aria-pressed="${view===k}">${l}</button>`).join('')}</div>
  ${view==='semana'?(C.myPts!=null?`<span class="lbl">Classificação da semana, pontos</span><div class="lb">${people.slice(0,8).map((p,i)=>`<div class="it ${p.me?'me':''}"><span class="n">${i+1}</span><span>${esc(p.nm)}</span><span class="t">${p.pts}</span></div>`).join('')}</div>
    <div class="card"><b>Pontuação do clube: ${C.score}</b><span class="small muted">Média do top 10 com ${Math.round(C.part*100)}% de membros ativos. Assim, clubes grandes e pequenos competem.</span></div>`:'<div class="small muted">A classificação aparece quando fechares a primeira semana.</div>')
  :`<span class="lbl">Divisão ${C.div} · pontos da temporada</span><div class="lb">${table.map((t,i)=>`<div class="it ${t.me?'me':''}"><span class="n">${i+1}</span><span>${esc(t.n)}</span><span class="t">${t.v}</span></div>`).join('')}</div><div class="small muted">No fim da temporada o 1º sobe e o último desce.</div>`}
  <div class="card acc"><b>${esc(c.ev.t)}</b><span class="small">${esc(c.ev.where)} · ${c.ev.sp==='bike'?'um treino de bike':'uma corrida'} nesse dia dá +15% e conta para o clube.</span></div>
  <h2 style="margin-top:6px">Treinar juntos</h2>
  <div class="card"><b>Long run de domingo</b><span class="small muted">Tu, ${fr.map(m=>esc(m.nm.split(' ')[0])).join(', ')}</span><div class="between"><div class="dots"><i></i><i></i><i></i><i></i></div><span class="small" style="color:var(--accent);font-weight:700">Corrida Z2 ao domingo: +15%</span></div></div>
  <div class="card"><b>Desafio: mais horas em Z2</b>${S.chal?`<span class="small">${S.chal.won?'Ganhaste a semana passada':'A semana passada'}: tu ${dec(S.chal.me)} h · ${S.chal.fr.map(f=>`${esc(f.nm.split(' ')[0])} ${dec(f.h)} h`).join(' · ')}</span>`:'<span class="small muted">Começa quando fechares a primeira semana. Conta bike e corrida em Z2.</span>'}</div>
  <div class="card acc"><b>Corre comigo</b><span class="small">Convida amigos com o teu código. Quem entra começa com um kit e 14 dias de Pro.</span><div class="between"><span class="code">${esc(S.invite)}</span><button class="btn sm" data-act="copy">Copiar código</button></div><span class="small muted">No protótipo o código ainda não chega a ninguém: os convites precisam do servidor.</span></div>`;
}
function vLoja(){
  const cats=[...new Set(SHOP.map(i=>i.cat))];
  return`${S.flash?`<div class="flash" role="status">${esc(S.flash)}</div>`:''}<div class="between"><h1>Loja</h1><span class="mono">${eur(S.money)}</span></div>
  ${cats.map(c=>`<div class="card"><h2>${c}</h2>${SHOP.filter(i=>i.cat===c).map(i=>{const pr=price(i),own=S.owned[i.id],sub=i.sub&&S.subs[i.id];
    const b=own?'<span class="chip good">Tens</span>':sub?`<button class="btn sm" data-act="unsub" data-arg="${i.id}">Cancelar</button>`:`<button class="btn sm" data-act="buy" data-arg="${i.id}">${S.money<pr?'Sem saldo':'Comprar'}</button>`;
    return`<div class="item"><div><b>${i.n}</b> <span class="mono small">${eur(pr)}${i.sub?'/sem':''}</span><div class="small muted">${i.d}</div></div>${b}</div>`}).join('')}</div>`).join('')}
  <div class="small muted">Marcas fictícias. Arte final dos produtos fica para o fim.</div>`;
}
function vCarreira(){
  const act=S.sponsors.map(s=>`<div class="item"><div><b>${esc(s.n)}</b><div class="small muted">${eur(s.weekly)}/semana · ${eur(s.podium)} por pódio · faltam ${s.left} semanas</div></div><span class="chip good">Ativo</span></div>`).join('');
  return`<div class="between"><h1>Carreira</h1><span class="small muted">Fama ${Math.round(S.fame)} · ${S.pts} pts</span></div>
  <div class="card"><h2>Temporada ${season()}</h2>${CAL.map(r=>{const res=S.results.find(x=>x.id===r.id&&x.season===season()),L=S.legends[r.id],D=DIST[r.t];
    const st=res?`${res.p}º/${res.N} · ${res.agP}º ${res.ag}`:r.w<wis()?'falhaste':!canEnter(r)?`<span style="color:var(--bad)">${whyNot(r)}</span>`:r.w===wis()?'este domingo':'inscrito';
    return`<div class="item"><div><b>Sem. ${r.w} · ${esc(r.n)}</b><div class="small muted">${D.l} · água ${r.temp} °C · ${eur(r.fee)}${r.slot?` · vagas para o Algarve: top ${r.slot} do escalão`:''}</div><div class="small muted">Lenda local: ${L.nm===S.ath.name?'<b>tu</b>':esc(L.nm)} (${L.count} participações)</div></div><span class="small">${st}</span></div>`}).join('')}</div>
  <div class="card"><h2>Patrocínios</h2>${act||'<span class="small muted">Ainda ninguém te paga. As propostas chegam à caixa de entrada quando a fama sobe.</span>'}
    ${SPONSORS.filter(s=>!S.sponsors.find(x=>x.id===s.id)).map(s=>`<div class="item"><div><b>${s.n}</b><div class="small muted">${esc(s.d)}</div></div><span class="chip ${S.fame>=s.minFame?'warn':''}">fama ${s.minFame}</span></div>`).join('')}</div>
  <div class="card"><h2>Resultados</h2>${S.results.length?`<div class="lb">${S.results.slice().reverse().map(r=>`<div class="it"><span class="n">${r.p}º</span><span>${esc(r.n)} <span class="small muted">· ${r.agP}º ${r.ag}</span></span><span class="t">${fmt(r.total)}</span></div>`).join('')}</div>`:'<span class="small muted">Ainda sem provas.</span>'}</div>
  <div class="card"><h2>Mensagens</h2>${S.inbox.filter(m=>m.done).slice(0,8).map(m=>`<div class="small"><b>${esc(m.t)}</b> — ${esc(m.x)}</div>`).join('')||'<span class="small muted">Sem mensagens.</span>'}</div>`;
}
function render(){
  document.getElementById('bar').innerHTML=vBar();
  document.getElementById('tabs').innerHTML=vTabs();
  document.getElementById('tabs').hidden=!S.created||!!(S.race&&S.race.stage!=='done'&&S.tab==='semana');
  const V={semana:vSemana,atleta:vAtleta,clube:vClube,loja:vLoja,carreira:vCarreira};
  document.getElementById('app').innerHTML=S.created?V[S.tab]():vOnboard();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.arg)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.input&&S.ob){S.ob[t.dataset.input]=t.value;S.ob.err[t.dataset.input]='';
  if(t.dataset.input==='age'){const a=parseInt(t.value,10),el=document.getElementById('ob-ag');if(el)el.textContent=a>=18&&a<=80?`Escalão ${AG(a)}`:'A idade define o teu escalão.'}save()}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.day){S.plan[+t.dataset.day]=t.value;save();render();const n=document.getElementById('d'+t.dataset.day);if(n)n.focus()}
  if(t.dataset.change&&S.ob){S.ob[t.dataset.change]=t.value;save()}
  if(t.dataset.file&&t.files.length){const files=[...t.files];
    if(t.dataset.file==='ob'){const{acts,errs}=await readFiles(files);S.ob.imp=acts.length?{...attrsFromActs(acts),errs}:{n:0,errs:errs.length?errs:['Nenhuma corrida, bike ou natação encontrada.'],a:{},sports:{run:0,bike:0,swim:0}};S.ob.err.files='';save();render()}
    else importWeek(files)}});
function start(data){
  S=(data&&data.v===2)?data:(load()||initState());
  if(S.race&&S.race.stage==='running'){S.race.stage='done';S.race.shown=S.race.res.feed.length}
  window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
  render();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
